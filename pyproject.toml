[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jagadish-dataset-engineering"
version = "0.1.0"
description = "Data pipelines for SFT and eval quality: annotation, filtering, dedup, decontamination, synthesis, dataset cards."
readme = "README.md"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["dataeng"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]
